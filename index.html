<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>병해충 예찰 기록</title>
<link rel="stylesheet" href="leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">🌱 병해충 예찰 기록</div>
  <nav>
    <button data-tab="new" class="active">＋ 새 예찰 기록</button>
    <button data-tab="list">📋 기록 목록</button>
    <button data-tab="map">🗺️ 예찰 지도</button>
    <button data-tab="ref">📖 병해충 참고</button>
  </nav>
  <div class="hdr-right pc-only">
    <button class="ghost" id="btnDataFolder" title="데이터 폴더 열기">📁</button>
    <button class="ghost" id="btnQuit" title="프로그램 종료">⏻ 종료</button>
  </div>
</header>

<main>
<!-- 새 기록 / 수정 -->
<section id="tab-new" class="tab active">
  <form id="recForm" autocomplete="off">
  <div class="cols">
    <div class="col">
      <div class="card">
        <h2>① 농가 도착 · 위치 기록 <span id="editBadge" class="badge hidden">수정 중</span></h2>
        <div class="row">
          <button type="button" class="primary big" id="btnLocate">📍 현재 위치 기록</button>
          <span id="locStatus" class="muted"></span>
        </div>
        <div class="row">
          <input id="addrSearch" placeholder="주소·지명으로 위치 찾기 (예: ○○군 ○○면 ○○리 123)">
          <button type="button" id="btnAddrSearch">검색</button>
        </div>
        <div id="searchResults" class="search-results"></div>
        <div id="formMap" class="map small"></div>
        <p class="hint">지도를 클릭하거나 마커를 끌어서 위치를 직접 지정할 수도 있습니다.</p>
        <div class="grid2">
          <label>위도<input name="lat" type="number" step="any"></label>
          <label>경도<input name="lng" type="number" step="any"></label>
        </div>
        <label>주소<input name="address" placeholder="위치 기록 시 자동 입력 (수정 가능)"></label>
        <label>방문일시<input name="visitedAt" type="datetime-local" step="1"></label>
        <div class="grid2">
          <label>농가명 *<input name="farmName" required placeholder="예: ○○농원"></label>
          <label>농가주<input name="farmer"></label>
          <label>연락처<input name="phone" placeholder="010-0000-0000"></label>
          <label>이메일<input name="email" type="email" placeholder="진단결과 송부용"></label>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <h2>② 사진 첨부</h2>
        <div class="row wrap photo-btns">
          <label class="btn primary-o">📷 사진 촬영<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden></label>
          <label class="btn">🖼 사진 선택<input type="file" id="photoInput" accept="image/*" multiple hidden></label>
        </div>
        <div id="dropZone" class="drop pc-only">사진 파일을 여기로 끌어 놓거나 Ctrl+V로 붙여넣을 수 있습니다.</div>
        <div id="photoPreview" class="thumbs"></div>
      </div>

      <div class="card">
        <h2>③ 병명 · 진단 · 대처방안</h2>
        <div class="grid2">
          <label>작물<input name="crop" list="cropList" placeholder="예: 고추"></label>
          <label>재배면적<input name="area" placeholder="예: 시설 1,650㎡"></label>
          <label>구분
            <select name="category"><option>병해</option><option>충해</option><option>생리장해</option><option>기타</option></select>
          </label>
          <label>심각도
            <select name="severity"><option>경미</option><option selected>보통</option><option>심각</option></select>
          </label>
        </div>
        <label>병해충명
          <div class="row tight">
            <input name="pestName" list="pestList" placeholder="예: 탄저병 (목록에서 선택 가능)">
            <button type="button" id="btnFillRef" title="참고자료의 증상/진단/대처방안 불러오기">참고 불러오기</button>
          </div>
        </label>
        <label>증상<textarea name="symptoms" rows="3"></textarea></label>
        <label>진단<textarea name="diagnosis" rows="3"></textarea></label>
        <label>대처방안<textarea name="remedy" rows="5"></textarea></label>
        <label>비고<textarea name="notes" rows="2"></textarea></label>
        <label>처리상태
          <select name="status"><option>진단중</option><option selected>조치안내</option><option>완료</option></select>
        </label>
      </div>
    </div>
  </div>
  <div class="actions sticky">
    <button type="button" id="btnReset" class="ghost">새로 작성</button>
    <button type="submit" class="primary big" id="btnSave">💾 저장</button>
  </div>
  </form>
  <datalist id="pestList"></datalist>
  <datalist id="cropList">
    <option>고추</option><option>토마토</option><option>딸기</option><option>오이</option><option>수박</option><option>참외</option>
    <option>배추</option><option>무</option><option>양파</option><option>마늘</option><option>감자</option><option>고구마</option>
    <option>벼</option><option>콩</option><option>옥수수</option><option>사과</option><option>배</option><option>복숭아</option><option>포도</option>
  </datalist>
</section>

<!-- 목록 -->
<section id="tab-list" class="tab">
  <div class="card">
    <div class="row wrap">
      <input id="q" placeholder="농가명, 주소, 작물, 병해충명 검색" class="grow">
      <select id="fCat"><option value="">구분 전체</option><option>병해</option><option>충해</option><option>생리장해</option><option>기타</option></select>
      <select id="fStatus"><option value="">상태 전체</option><option>진단중</option><option>조치안내</option><option>완료</option></select>
      <input id="fFrom" type="date" title="시작일"> ~ <input id="fTo" type="date" title="종료일">
      <button type="button" id="btnCSV">⬇ 엑셀(CSV)</button>
      <button type="button" id="btnBackup" title="사진 포함 전체 기록을 파일로 저장 (휴대폰↔PC 옮기기용)">📦 백업 파일 내보내기</button>
      <label class="btn filebtn" title="휴대폰/PC에서 만든 백업 파일의 기록을 합치기">📥 백업 파일 가져오기<input type="file" id="importInput" accept=".json,application/json" hidden></label>
    </div>
    <div id="summary" class="muted"></div>
    <table class="list">
      <thead><tr><th>사진</th><th>방문일시</th><th>농가명</th><th>주소</th><th>작물</th><th>병해충명</th><th>심각도</th><th>상태</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
</section>

<!-- 지도 -->
<section id="tab-map" class="tab">
  <div class="card full">
    <div class="row wrap">
      <strong>예찰 지점</strong>
      <span class="legend"><i class="dot 경미"></i>경미 <i class="dot 보통"></i>보통 <i class="dot 심각"></i>심각</span>
      <span id="mapCount" class="muted"></span>
    </div>
    <div id="bigMap" class="map big"></div>
  </div>
</section>

<!-- 참고 -->
<section id="tab-ref" class="tab">
  <div class="card">
    <p class="muted">현장 기록 편의를 위한 일반 안내입니다. 실제 약제 선택은 <b>농약안전정보시스템(psis.rda.go.kr)</b>에서 작물별 등록약제·안전사용기준을 확인하고, 판단이 어려운 경우 정밀진단을 의뢰하세요.</p>
    <input id="refQ" placeholder="병해충명·작물 검색" class="grow">
    <div id="refList" class="ref-list"></div>
  </div>
</section>
</main>

<!-- 상세 보기 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" id="modalClose">✕</button>
    <div id="detail"></div>
    <div class="actions">
      <button id="btnDelete" class="danger">삭제</button>
      <span class="grow"></span>
      <button id="btnPrint">🖨 진단서 출력</button>
      <button id="btnEdit" class="primary">수정</button>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden"><img id="lightImg" alt=""></div>
<div id="toast" class="toast hidden"></div>
<div id="printArea"></div>

<script src="leaflet/leaflet.js"></script>
<script src="pests.js"></script>
<script src="app.js"></script>
</body>
</html>
